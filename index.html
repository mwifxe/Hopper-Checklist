<style>
/* Layout: una columna pensada para el cel; barra de progreso fija arriba, chips por día, días plegables */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a63; --line:#d6ddd8;
  --accent:#2f7d4f; --accent-soft:#e1efe6; --warn:#a4631a; --warn-soft:#f6ead9; --band:#d9a521;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --surface:#1c231f; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2f3934;
  --accent:#6cc28e; --accent-soft:#1f3529; --warn:#e0a35a; --warn-soft:#3a2c1b; --band:#e8b93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --surface:#1c231f; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2f3934;
  --accent:#6cc28e; --accent-soft:#1f3529; --warn:#e0a35a; --warn-soft:#3a2c1b; --band:#e8b93a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}

/* Encabezado con logo */
header{display:flex;align-items:center;gap:14px;padding-block:28px 18px}
.logo{flex:none;width:56px;height:72px;color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
.logo svg{width:100%;height:100%;overflow:visible;display:block}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.lead{color:var(--muted);font-size:15px;margin:0 0 16px}

/* Animación del hopper: abre las 3 patas en reposo, las junta para cargar, salta y las vuelve a abrir al aterrizar */
#hop{transform-box:fill-box;transform-origin:50% 100%}
#shadow{transform-box:fill-box;transform-origin:50% 50%}
.leg{transform-box:fill-box;transform-origin:50% 0}
#legL{transform:rotate(16deg)}
#legR{transform:rotate(-16deg)}
.play #hop{animation:hop 1.7s cubic-bezier(.3,.1,.3,1) .3s both}
.play #shadow{animation:shade 1.7s cubic-bezier(.3,.1,.3,1) .3s both}
.play #band{animation:band 1.7s ease .3s both}
.play #legL{animation:legL 1.7s cubic-bezier(.4,0,.2,1) .3s both}
.play #legR{animation:legR 1.7s cubic-bezier(.4,0,.2,1) .3s both}
@keyframes hop{
  0%,10%{transform:translateY(0) scaleY(1)}
  30%,36%{transform:translateY(1px) scaleY(.93)}
  48%{transform:translateY(-30px) scaleY(1.04)}
  62%{transform:translateY(-34px) scaleY(1)}
  80%{transform:translateY(0) scaleY(.95)}
  90%,100%{transform:translateY(0) scaleY(1)}}
@keyframes legL{0%,10%{transform:rotate(16deg)}30%,80%{transform:rotate(-5deg)}94%,100%{transform:rotate(16deg)}}
@keyframes legR{0%,10%{transform:rotate(-16deg)}30%,80%{transform:rotate(5deg)}94%,100%{transform:rotate(-16deg)}}
@keyframes shade{
  0%,36%{transform:scaleX(1);opacity:.25}
  62%{transform:scaleX(.45);opacity:.1}
  80%,100%{transform:scaleX(1);opacity:.25}}
@keyframes band{0%,10%{stroke-width:2.2}30%,36%{stroke-width:3.4}48%,100%{stroke-width:2.2}}

/* Barra de progreso fija */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.overall-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.today{border-color:var(--accent)}

/* Días */
.days{display:grid;gap:12px;margin-top:16px}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:120px}
summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:16px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.dname{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dtitle{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;grid-column:1}
.count{grid-row:1 / span 2;grid-column:2;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.count::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details[open] .count::after{transform:rotate(-135deg) translateY(-2px)}
.day.done .count{color:var(--accent)}
.body{padding:0 16px 6px}
.goal{color:var(--muted);font-size:15px;margin:0 0 10px}
.alert{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:15px;margin:0 0 10px}
.alert strong{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
label{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;cursor:pointer;min-height:48px}
input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0}
.txt b{font-weight:700}
.sec{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.note{display:block;color:var(--muted);font-size:15px;margin-top:3px}
li.checked .txt{color:var(--muted)}
li.checked .txt b{text-decoration:line-through}
footer{margin-top:24px;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:start}
button.reset{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.play #hop,.play #shadow,.play #band{animation:none}.bar>i,.count::after{transition:none}}
</style>

<div class="wrap">

  <button class="logo" id="logo" type="button" aria-label="Hopper (tocá para verlo saltar)">
    <svg viewBox="0 0 60 80" aria-hidden="true">
      <ellipse id="shadow" cx="30" cy="73" rx="20" ry="2.4" fill="currentColor" opacity=".25"/>
      <g id="hop">
        <!-- cúpula -->
        <path d="M8 26 A22 20 0 0 1 52 26 Z" fill="currentColor"/>
        <!-- anillo inferior con ranura del pestillo -->
        <rect x="8" y="28" width="12" height="7" rx="1" fill="currentColor"/>
        <rect x="23" y="28" width="29" height="7" rx="1" fill="currentColor"/>
        <!-- pata trasera (al centro, detrás) -->
        <rect id="legM" x="25.5" y="34" width="9" height="36" rx="1" fill="currentColor" opacity=".5"/>
        <!-- liga -->
        <path id="band" d="M27.5 37 l5 3.5 -5 3.5 5 3.5 -5 3.5" fill="none" stroke="var(--band)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- patas laterales -->
        <rect id="legL" class="leg" x="14.5" y="34" width="9" height="36" rx="1" fill="currentColor"/>
        <rect id="legR" class="leg" x="36.5" y="34" width="9" height="36" rx="1" fill="currentColor"/>
      </g>
    </svg>
  </button>
  <div>
    <div class="eyebrow">Hopper Project · Entrega 2</div>
    <h1>Plan de 7 días</h1>
  </div>
</header>
<p class="lead">Del lunes 12 al domingo 18 de octubre, con 10 días de colchón antes del 28. Cada etiqueta dice a qué sección del reporte va la tarea.</p>

<div class="sticky">
  <div class="overall-row"><span>Avance total</span><span id="totalTxt">0 / 0</span></div>
  <div class="bar"><i id="totalBar"></i></div>
  <nav class="chips" id="chips" aria-label="Ir a un día"></nav>
</div>

<div class="days" id="days"></div>

<footer>
  <span>El avance se guarda en este navegador.</span>
  <button type="button" class="reset" id="reset">Desmarcar todo</button>
</footer>
</div>

<script>
const plan=[
 {d:"Lun 12",iso:"2026-10-12",t:"Documentar lo que ya existe",goal:"Aprovechar que la iteración 1 y el prototipo mejorado ya están hechos.",items:[
  ["Fotografiar la iteración 1 y el prototipo mejorado","Nítidas, con buena luz y fondo despejado: vista general y detalle del mecanismo de energía.","6"],
  ["Anotar qué falló en la v1 y qué cambiaste en la v2","Con datos concretos si los tenés (por ejemplo, altura aproximada del salto).","6"],
  ["Hacer la lista completa de materiales y para qué se usó cada uno","","6"],
  ["Elegir el tipo de release","Gatillo, pestillo, imanes... y en qué punto del hopper va. Bocetá 2 opciones y quedate con una.","5"]]},
 {d:"Mar 13",iso:"2026-10-13",t:"Release en CAD",goal:"Diseñarlo e integrarlo al ensamble, no dejarlo como pieza suelta.",items:[
  ["Modelar las piezas del release en SolidWorks","","5"],
  ["Integrarlo al ensamble con relaciones de posición","","4"],
  ["Dejar configuradas las posiciones bloqueado y liberado","Las vas a necesitar para las capturas lado a lado.","5"],
  ["Escribir la lista de piezas del release y la función de cada una","","5"]]},
 {d:"Mié 14",iso:"2026-10-14",t:"Release en físico",goal:"Construirlo y lograr que trabe y suelte bien.",items:[
  ["Construir el release en el prototipo","","6"],
  ["Probar carga, bloqueo y activación varias veces, y ajustar","Anotá qué ajustaste: también cuenta como iteración.","9"],
  ["Foto nítida del detalle del release","Es la tercera foto obligatoria.","6"]]},
 {d:"Jue 15",iso:"2026-10-15",t:"Pruebas y video",goal:"Mínimo 3 pruebas medidas y el video en el orden que pide la guía.",alert:"El video debe mostrar la activación del release, por eso estas pruebas van después del miércoles.",items:[
  ["Preparar el set de grabación","Celular fijo a la altura de la mesa, vista lateral, buena luz y regla o cinta visible.","7"],
  ["Grabar en orden: reposo, carga, toma de cerca del release y salto sin cortes","","Video"],
  ["Hacer al menos 2 intentos de salto seguidos en cámara","","Video"],
  ["Hacer 3 pruebas cambiando algo en cada una y llenar la tabla","Qué cambió, altura en cm, dirección, observaciones y captura del video. Si no salta, registrá 0 cm y explicá la causa.","7"],
  ["Subir el video a Drive con acceso \"Cualquier persona con el enlace\"","","Video"]]},
 {d:"Vie 16",iso:"2026-10-16",t:"Imágenes CAD y primeras secciones",goal:"Sacar todas las capturas y escribir la parte de diseño.",items:[
  ["Tabla carga / reposo: vista frontal e isométrica (4 imágenes)","Con 2 a 4 líneas debajo de cada columna explicando qué se estira o se comprime.","4"],
  ["Captura completa de SolidWorks con el FeatureManager visible","Sin recortar.","4"],
  ["Capturas del release bloqueado y liberado, lado a lado","","5"],
  ["Imagen del hopper con etiquetas y flechas","Cuerpo, piernas, liga o resorte y elemento de release.","5"],
  ["Escribir definición del problema y objetivos","","3"],
  ["Escribir el ensamble por partes, dónde se almacena la energía y los ajustes desde la Entrega 1","Para cada parte: qué representa de la pulga y qué función cumple.","4"],
  ["Escribir la descripción y la secuencia de funcionamiento del release","Qué lo activa y en qué dirección actúa la fuerza.","5"]]},
 {d:"Sáb 17",iso:"2026-10-17",t:"Análisis",goal:"Es lo que más pesa: un prototipo bien analizado vale más que uno que solo funciona.",items:[
  ["Sección de fotografías del prototipo con pies de figura","","6"],
  ["Pasar la tabla de pruebas al reporte","","7"],
  ["Resultados: altura vs. objetivo, estabilidad, dirección y materiales","2 a 4 líneas cada uno.","7"],
  ["Correspondencia entre CAD y prototipo","Qué se mantuvo, qué se simplificó y por qué.","8"],
  ["Iteración y próximos pasos","Cada cambio sale de una prueba: \"En la prueba 2... por eso cambiaré... lo validaré con...\".","9"]]},
 {d:"Dom 18",iso:"2026-10-18",t:"Cierre y revisión",goal:"Dejarlo listo para entregar.",items:[
  ["Conclusiones, portada, índice y anexos","","1, 2, 10, 11"],
  ["Numerar todas las imágenes y tablas y mencionarlas en el texto","","Formato"],
  ["Revisar la redacción: primera persona y lenguaje técnico","\"Liberación de energía elástica\", no \"la liga lo empuja\".","Formato"],
  ["Revisar la ortografía, incluido release (no realese)","","Formato"],
  ["Pegar el enlace del video en la sección 5 y abrirlo en incógnito","","Video"],
  ["Exportar el Word a PDF con el nombre Mendoza_Emely","","Entrega"]]}
];

const KEY="hopper-e2-checks";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secLabel=s=>/^\d/.test(s)?"Sec. "+s:s;

const now=new Date();
const todayIso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
let openIdx=plan.findIndex(p=>p.iso===todayIso);
if(openIdx<0) openIdx=todayIso<plan[0].iso?0:-1;

const root=document.getElementById("days"), chips=document.getElementById("chips");
plan.forEach((day,di)=>{
  const el=document.createElement("details");el.className="day";el.id="d"+di;
  if(di===openIdx) el.open=true;
  el.innerHTML=`<summary><span class="dname">${day.d}</span><span class="count"></span><span class="dtitle">${esc(day.t)}</span></summary>
  <div class="body"><p class="goal">${esc(day.goal)}</p>${day.alert?`<div class="alert"><strong>Ojo:</strong> ${esc(day.alert)}</div>`:""}
  <ul>${day.items.map((it,ii)=>{const id=`c${di}-${ii}`;return `<li><label for="${id}"><input type="checkbox" id="${id}" data-k="${id}">
  <span class="txt"><b>${esc(it[0])}</b><span class="sec">${esc(secLabel(it[2]))}</span>${it[1]?`<span class="note">${esc(it[1])}</span>`:""}</span></label></li>`}).join("")}</ul></div>`;
  root.appendChild(el);
  const c=document.createElement("button");c.type="button";c.className="chip"+(day.iso===todayIso?" today":"");c.dataset.i=di;
  chips.appendChild(c);
});

function render(){
  let all=0,done=0;
  document.querySelectorAll("details.day").forEach((day,di)=>{
    const boxes=day.querySelectorAll("input");let n=0;
    boxes.forEach(b=>{b.checked=!!state[b.dataset.k];b.closest("li").classList.toggle("checked",b.checked);if(b.checked)n++});
    day.querySelector(".count").textContent=`${n}/${boxes.length}`;
    const full=n===boxes.length;day.classList.toggle("done",full);
    const chip=chips.children[di];chip.textContent=`${plan[di].d} · ${n}/${boxes.length}`;chip.classList.toggle("done",full);
    all+=boxes.length;done+=n;
  });
  document.getElementById("totalTxt").textContent=`${done} / ${all}`;
  document.getElementById("totalBar").style.width=(all?done/all*100:0)+"%";
}
root.addEventListener("change",e=>{if(e.target.dataset.k){state[e.target.dataset.k]=e.target.checked;save();render()}});
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const d=document.getElementById("d"+b.dataset.i);d.open=true;d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});
document.getElementById("reset").addEventListener("click",()=>{state={};save();render()});

const logo=document.getElementById("logo");
function jump(){logo.classList.remove("play");void logo.offsetWidth;logo.classList.add("play")}
logo.addEventListener("click",jump);
jump();
render();
</script>
